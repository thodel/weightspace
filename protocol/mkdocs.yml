site_name: Weight-space programming on HTR models — research protocol
site_description: >-
  Dated, preregistered record of reading, editing and measuring the weights of
  kraken handwritten-text-recognition models without gradient descent.
site_author: Tobias Hodel
# site_url and repo_url are set at publication time (protocol/PUBLISHING.md)
copyright: Text CC BY 4.0 (to be confirmed at publication)

docs_dir: docs
exclude_docs: |
  _templates/
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Method and rules: method.md
  - Protocol amendments: amendments.md
  - Journal:
      - journal/index.md
      - "2026-11-06 · Phase 0: harness, practice sets, baselines": journal/2026-11-06-a-phase0.md
      - "2026-11-06 · Phase 1: first budgeted session": journal/2026-11-06-b-phase1.md
      - "2026-11-06 · Keep rule gets a minimum effect": journal/2026-11-06-c-keep-rule.md
      - "2026-11-06 · C3 per-block α-sweep": journal/2026-11-06-d-alpha-sweep.md
      - "2026-11-06 · Phase 3: target 1 on correct pages": journal/2026-11-06-e-phase3.md
      - "2026-11-06 · Phase 4: collapsed lines are a data question": journal/2026-11-06-f-phase4.md
      - "2026-11-07 · Phase 5: collapse detector, handwriting held-out set": journal/2026-11-07-a-phase5.md
      - "2026-11-07 · The kraken family as networks": journal/2026-11-07-b-model-family.md
      - "2026-11-07 · Weight survey of the kraken zoo": journal/2026-11-07-c-zoo-survey.md
      - "2026-11-07 · Seed-variance null": journal/2026-11-07-d-seed-null.md
      - "2026-11-07 · Controls for the article": journal/2026-11-07-e-controls.md
      - "2026-11-07 · Layer probes": journal/2026-11-07-f-layer-probes.md
      - "2026-11-07 · latin_incunabula candidate decision": journal/2026-11-07-g-candidate-decision.md
      - "2026-11-07 · Adapter track A0–A4": journal/2026-11-07-h-adapter-track.md
      - "2026-11-08 · Phase 5 adapter session (open)": journal/2026-11-08-a-adapter-session-v2.md
  - Results: results.md
  - Figures: figures/README.md
