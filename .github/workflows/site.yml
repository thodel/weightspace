# Renders the public site (site/, Quarto, dhbern layout) and deploys it to GitHub Pages.
# The protocol pages are generated from protocol/docs during the render (site/scripts/protocol_to_quarto.py),
# which fails if a page names an internal host or path.
# Runs only while the repository is public; Pages is not available for this private repository.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "protocol/docs/**"
      - "protocol/mkdocs.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
